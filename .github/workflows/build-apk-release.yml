name: Build & Release SkinCare Daily APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Verify & Ensure All Gradle and Resource Files Exist
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            cat << 'EOF' > settings.gradle.kts
          pluginManagement {
            repositories {
              google {
                content {
                  includeGroupByRegex("com\\.android.*")
                  includeGroupByRegex("com\\.google.*")
                  includeGroupByRegex("androidx.*")
                }
              }
              mavenCentral()
              gradlePluginPortal()
            }
          }
          plugins { id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0" }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "SkinCare Daily"
          include(":app")
          EOF
          fi

          if [ ! -f "build.gradle.kts" ]; then
            cat << 'EOF' > build.gradle.kts
          plugins {
            alias(libs.plugins.android.application) apply false
            alias(libs.plugins.kotlin.compose) apply false
            alias(libs.plugins.google.devtools.ksp) apply false
            alias(libs.plugins.secrets) apply false
            alias(libs.plugins.google.services) apply false
          }
          EOF
          fi

          if [ ! -f "gradle.properties" ]; then
            cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          org.gradle.parallel=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          org.gradle.caching=true
          org.gradle.configuration-cache=true
          org.gradle.workers.max=4
          kotlin.compiler.execution.strategy=in-process
          googleServices.missing.passthrough=true
          EOF
          fi

          if [ ! -f ".env.example" ]; then
            echo "# GEMINI_API_KEY=MY_GEMINI_API_KEY" > .env.example
          fi

          if [ ! -f "app/proguard-rules.pro" ]; then
            touch app/proguard-rules.pro
          fi

          mkdir -p gradle
          if [ ! -f "gradle/libs.versions.toml" ]; then
            cat << 'EOF' > gradle/libs.versions.toml
          [versions]
          agp = "9.1.1"
          coreKtx = "1.18.0"
          junit = "4.13.2"
          junitVersion = "1.3.0"
          espressoCore = "3.7.0"
          lifecycleRuntimeKtx = "2.8.7"
          lifecycleViewmodelCompose = "2.8.7"
          lifecycleRuntimeCompose = "2.8.7"
          activityCompose = "1.10.1"
          kotlin = "2.2.10"
          composeBom = "2024.09.00"
          googleDevtoolsKsp = "2.3.5"
          navigationCompose = "2.8.9"
          roomRuntime = "2.7.0"
          roomKtx = "2.7.0"
          roomCompiler = "2.7.0"
          kotlinxCoroutinesTest = "1.10.2"
          core = "1.6.1"
          runner = "1.6.2"
          coilCompose = "2.7.0"
          retrofit = "2.12.0"
          converterMoshi = "2.12.0"
          kotlinxCoroutinesAndroid = "1.10.2"
          kotlinxCoroutinesCore = "1.10.2"
          accompanistPermissions = "0.37.3"
          playServicesLocation = "21.3.0"
          cameraCamera2 = "1.5.0"
          cameraLifecycle = "1.5.0"
          cameraView = "1.5.0"
          cameraCore = "1.5.0"
          loggingInterceptor = "4.10.0"
          okhttp = "4.10.0"
          moshiKotlin = "1.15.2"
          moshiKotlinCodegen = "1.15.2"
          datastorePreferences = "1.1.7"
          robolectric = "4.16.1"
          firebaseBom = "34.17.0"
          secretsGradlePlugin = "2.0.1"
          googleServices = "4.5.0"
          credentials = "1.5.0"
          googleid = "1.1.1"

          [libraries]
          androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
          junit = { group = "junit", name = "junit", version.ref = "junit" }
          androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
          androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
          androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
          androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
          androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
          androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
          androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
          androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
          androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
          androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
          androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
          androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
          androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
          androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
          androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
          androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
          kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
          androidx-core = { group = "androidx.test", name = "core", version.ref = "core" }
          androidx-runner = { group = "androidx.test", name = "runner", version.ref = "runner" }
          androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
          androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
          androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
          coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }
          retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
          converter-moshi = { group = "com.squareup.retrofit2", name = "converter-moshi", version.ref = "converterMoshi" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinxCoroutinesAndroid" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutinesCore" }
          accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanistPermissions" }
          play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
          androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "cameraCamera2" }
          androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "cameraLifecycle" }
          androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "cameraView" }
          androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "cameraCore" }
          logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "loggingInterceptor" }
          okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
          moshi-kotlin = { group = "com.squareup.moshi", name = "moshi-kotlin", version.ref = "moshiKotlin" }
          moshi-kotlin-codegen = { group = "com.squareup.moshi", name = "moshi-kotlin-codegen", version.ref = "moshiKotlinCodegen" }
          androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
          robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
          firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
          firebase-ai = { group = "com.google.firebase", name = "firebase-ai" }
          firebase-appcheck-recaptcha = { group = "com.google.firebase", name = "firebase-appcheck-recaptcha" }
          firebase-appcheck-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
          firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore" }
          firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
          androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
          androidx-credentials-play-services = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
          googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "googleDevtoolsKsp" }
          secrets = { id = "com.google.android.libraries.mapsplatform.secrets-gradle-plugin", version.ref = "secretsGradlePlugin" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          EOF
          fi

          # Ensure Android XML & Font resources exist
          mkdir -p app/src/main/res/values
          if [ ! -f "app/src/main/res/values/themes.xml" ]; then
            cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.MyApplication" parent="android:Theme.DeviceDefault.NoActionBar" />
          </resources>
          EOF
          fi

          mkdir -p app/src/main/res/xml
          if [ ! -f "app/src/main/res/xml/backup_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/backup_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
          </full-backup-content>
          EOF
          fi

          if [ ! -f "app/src/main/res/xml/data_extraction_rules.xml" ]; then
            cat << 'EOF' > app/src/main/res/xml/data_extraction_rules.xml
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
              </cloud-backup>
          </data-extraction-rules>
          EOF
          fi

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml" ]; then
            cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

          if [ ! -f "app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml" ]; then
            cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          fi

          mkdir -p app/src/main/res/font
          if [ ! -f "app/src/main/res/font/plus_jakarta_sans.ttf" ]; then
            curl -L -s "https://fonts.gstatic.com/s/plusjakartasans/v12/LDIbaomQNQcsA88c7O9yZ4KMCoOg4IA6-91aHEjcWuA_qU79TR_Q.ttf" -o app/src/main/res/font/plus_jakarta_sans.ttf
          fi
          if [ ! -f "app/src/main/res/font/fraunces.ttf" ]; then
            curl -L -s "https://fonts.gstatic.com/s/fraunces/v38/6NUh8FyLNQOQZAnv9bYEvDiIdE9Ea92uemAk_WBq8U_9v0c2Wa0K7iN7hzFUPJH58nib1603gg7S2nfgRYIctxuTCf7W.ttf" -o app/src/main/res/font/fraunces.ttf
          fi

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$ANDROID_SDK_ROOT/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_SDK_ROOT/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_SDK_ROOT/licenses/android-sdk-preview-license"
          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Ensure debug.keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --info

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SkinCare-Daily.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkinCare-Daily-APK
          path: SkinCare-Daily.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "SkinCare Daily v1.0.${{ github.run_number }} (APK)"
          body: |
            ### SkinCare Daily — Native Android APK
            Unduh file **`SkinCare-Daily.apk`** di bagian **Assets** di bawah ini untuk langsung menginstal aplikasi di ponsel Android Anda.
          files: SkinCare-Daily.apk
          draft: false
          prerelease: false
